# ---------------------------------------------------------------------------
# Version catalogue — the single place every build dependency version lives.
#
# Pinned, not floating. Changing a version here is a reviewable event
# (docs/security.md § 11, ADR-0012) and requires the dependency verification
# metadata in gradle/verification-metadata.xml to be regenerated.
# ---------------------------------------------------------------------------

[versions]
agp = "8.10.1"
kotlin = "2.2.20"
composeMultiplatform = "1.9.3"
mlkitText = "16.0.1"
ksp = "2.2.20-2.0.4"
coroutines = "1.10.2"
serialization = "1.9.0"
datetime = "0.6.2"
poi = "5.2.5"
room = "2.8.5"
sqlcipher = "4.5.4"
hilt = "2.57.2"
androidxCore = "1.17.0"
activityCompose = "1.10.1"
lifecycle = "2.9.4"
work = "2.9.0"
navigationCompose = "2.9.6"
composeBomAndroid = "2025.10.00"
junit4 = "4.13.2"
testRunner = "1.6.1"
testCore = "1.6.1"
testExtJunit = "1.2.1"

# Android SDK levels (docs/architecture.md § 14).
compileSdk = "36"
targetSdk = "36"
minSdk = "26"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Room — Android-only module (docs/architecture.md § 3.2).
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# SQLCipher — at-rest encryption for the Room database (docs/privacy.md § 4,
# docs/hardening.md). Pinned like everything else; verification metadata
# regenerated at the gate.
androidx-sqlcipher = { module = "net.zetetic:android-database-sqlcipher", version.ref = "sqlcipher" }

# Hilt — Android DI only in V1 (docs/decisions.md R-14).
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# Instrumented-test support (Phase 1: launch smoke test + database tests).
# Unit-test assertions stay kotlin.test; androidTest uses JUnit4 + the test runner.
junit-junit4 = { module = "junit:junit", version.ref = "junit4" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
mlkit-text = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitText" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "testCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
